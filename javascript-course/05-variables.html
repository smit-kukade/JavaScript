<!DOCTYPE html>
<html>
    <head>
        <title>
            Variable
        </title>
    </head>
    <body>
        <script>
            const variable1 = 3;
            console.log(variable1);

            let calculation = 2 + 2;
            console.log(calculation);
            console.log(calculation + 2);

            const variable2 = 3;
            console.log(variable2);

            var variable3 = 3;
            console.log(variable3);
    
        </script>
    </body>
</html>
