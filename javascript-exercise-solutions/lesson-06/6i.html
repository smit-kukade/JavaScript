<!DOCTYPE html>
<html>
    <head>
    </head>
    <body>
        <script>
            const randomNumber = Math.random();
            let guess;

            if (randomNumber <= 0.5){
                guess = `heads`;
            } else if (randomNumber >= 0.5){
                guess = `tails`;
            }

            if (guess === 'heads'){
                console.log(`You win!`);
            } else if (guess === 'tails') {
                console.log(`You lose!`);
            }
        </script>
    </body>
</html>
