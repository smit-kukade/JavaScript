  <body>
    <script>
      function comparePrice(product1, product2) {
        if (product1.price < product2.price) {
          return product1;
        } else {
          return product2;
        }
      }
        product1 = {
          name: 'basketball',
          price: 2095
        };

        product2 = {
          name: 'socks',
          price: 1000
        };

        console.log(comparePrice(product1, product2));
    </script>
  </body>
