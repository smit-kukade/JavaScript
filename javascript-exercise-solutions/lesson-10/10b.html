<!DOCTYPE html>
<html>
    <head>
        <style>
            .request-button {
                background-color: black;
                color: white;
                border: none;
                font-weight: bold;
                padding: 10px 15px;
                border-radius: 6px;
                margin-right: 10px;
            }

            .schedule-button{
                background-color: rgb(230, 230, 230);
                color: black;
                padding: 10px 15px;
                border-radius: 6px;
                border: none;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <button class="request-button">
            Request now
        </button>
        <button class="schedule-button">
            Schedule for later
        </button>
    </body>
</html>
