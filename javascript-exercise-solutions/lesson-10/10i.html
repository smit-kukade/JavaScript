<!DOCTYPE html>
<html>
  <head>
    <title>
      9j
    </title>
    <style>
        body {
            background-color: black;
            font-family: "Arial";
        }

        .calculation-button{
            height: 60px;
            width: 60px;
            border-radius: 60px;
            border: none;
            font-size: 26px;
            cursor: pointer;
            margin-right: 5px;
        }

        .button{
            color: white;
            background-color: rgb(63, 58, 58);
        }

        .clear-button {
            font-size: 16px;
            background-color: rgb(63, 58, 58);
            color: white;
        }

        .button-operator {
            background-color: orange;
            color: white;
        }

        .calculation{
            color: white;
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 15px;
        }
    </style>
  </head>
  <body>
    <p class="js-calculation calculation"></p>
    <p>
      <button onclick="
        updateCalculation('1');
      " class="calculation-button  button">1</button>

      <button onclick="
        updateCalculation('2');
      " class="calculation-button button">2</button>

      <button onclick="
        updateCalculation('3');
      " class="calculation-button button">3</button>

      <button onclick="
        updateCalculation(' + ');
      " class="calculation-button button-operator">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      " class="calculation-button button">4</button>

      <button onclick="
        updateCalculation('5');
      " class="calculation-button button">5</button>

      <button onclick="
        updateCalculation('6');
      " class="calculation-button button">6</button>

      <button onclick="
        updateCalculation(' - ');
      " class="calculation-button button-operator">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      " class="calculation-button button">7</button>

      <button onclick="
        updateCalculation('8');
      " class="calculation-button button">8</button>

      <button onclick="
        updateCalculation('9');
      " class="calculation-button button">9</button>

      <button onclick="
        updateCalculation(' * ');
      " class="calculation-button button-operator">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      " class="calculation-button button">0</button>

      <button onclick="
        updateCalculation('.');
      " class="calculation-button button">.</button>

      <button onclick="
        calculation = eval(calculation);
        displayCalculation();
        localStorage.setItem('calculation', calculation);
      " class="calculation-button button">=</button>

      <button onclick="
        updateCalculation(' / ');
      " class="calculation-button button-operator">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        displayCalculation();
        localStorage.setItem('calculation', calculation);
      " class="calculation-button clear-button">Clear</button>
    </p>

    <script>
      let calculation = localStorage.getItem('calculation') || '';

      function updateCalculation(value) {
        calculation += value;
        displayCalculation();
        localStorage.setItem('calculation', calculation);
      }

      function displayCalculation() {
        document.querySelector('.js-calculation').innerHTML = calculation;
      }
    </script>
  </body>
</html>
