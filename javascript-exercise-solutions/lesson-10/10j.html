<!DOCTYPE html>
<html>
  <head>
    <title>
      9j
    </title>
    <link rel="stylesheet" href="styles/10j.css">

  </head>
  <body>
    <p class="js-calculation calculation"></p>
    <p>
      <button onclick="
        updateCalculation('1');
      " class="calculation-button  button">1</button>

      <button onclick="
        updateCalculation('2');
      " class="calculation-button button">2</button>

      <button onclick="
        updateCalculation('3');
      " class="calculation-button button">3</button>

      <button onclick="
        updateCalculation(' + ');
      " class="calculation-button button-operator">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      " class="calculation-button button">4</button>

      <button onclick="
        updateCalculation('5');
      " class="calculation-button button">5</button>

      <button onclick="
        updateCalculation('6');
      " class="calculation-button button">6</button>

      <button onclick="
        updateCalculation(' - ');
      " class="calculation-button button-operator">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      " class="calculation-button button">7</button>

      <button onclick="
        updateCalculation('8');
      " class="calculation-button button">8</button>

      <button onclick="
        updateCalculation('9');
      " class="calculation-button button">9</button>

      <button onclick="
        updateCalculation(' * ');
      " class="calculation-button button-operator">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      " class="calculation-button button">0</button>

      <button onclick="
        updateCalculation('.');
      " class="calculation-button button">.</button>

      <button onclick="
        calculation = eval(calculation);
        displayCalculation();
        localStorage.setItem('calculation', calculation);
      " class="calculation-button button">=</button>

      <button onclick="
        updateCalculation(' / ');
      " class="calculation-button button-operator">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        displayCalculation();
        localStorage.setItem('calculation', calculation);
      " class="calculation-button clear-button">Clear</button>
    </p>
    <script src="scripts/10j.js"></script>
  </body>
</html>
